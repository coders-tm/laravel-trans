laravel: "@testbench"

providers:
  - Trans\LaravelTransServiceProvider

workbench:
  install: true
  discovers:
    web: false
    api: false
    commands: true
    components: false
    factories: false
    views: false
  build:
    - sync-skeleton
  sync:
    - from: ./config/trans.php
      to: workbench/config/trans.php
      reverse: true
    - from: workbench/resources/lang
      to: resources/lang
    - from: workbench/resources/views
      to: resources/views
    - from: workbench/resources/js
      to: resources/js
    - from: workbench/app
      to: app
